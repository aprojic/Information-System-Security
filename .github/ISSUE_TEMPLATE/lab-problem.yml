name: Problem with a lab
description: A step doesn't work the way the instructions say.
title: "[Lab XX] "
labels: [lab-problem]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Issues are **public**: never paste real passwords, keys, tokens, or anything from a system you don't own.
  - type: dropdown
    id: lab
    attributes:
      label: Which lab?
      options:
        - Lab 00 — Setup
        - Lab 01 — Hashing
        - Lab 02 — Network traffic
        - Lab 03 — Injection & XSS
        - Lab 04 — Auth & access
        - Lab 05 — Exploitation & privesc
        - Lab 06 — Capstone
        - Lab 07 — AI security
        - Other
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Which step?
      placeholder: "e.g. 1.3 Mask attack on your personal FLAG"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where were you working?
      options:
        - Kali (VirtualBox VM)
        - Kali + Docker target
        - My own computer
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command and output
      description: Paste the command you ran and the error you got.
      render: shell
