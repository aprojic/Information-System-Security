# Lab 08 — target: a local vulnerable LLM chatbot (SecureBot) + Ollama.
# First: copy .env.example to .env and set ISS_SECRET (from the instructor).
# Start (in Kali):
#   docker compose up -d --build
#   docker compose exec ollama ollama pull llama3.2:1b   # once; ~1.3 GB
#   → http://localhost:5000  (enter your student ID on the page)
# Part 2 (defence): set GUARDRAIL=on in .env, then: docker compose up -d securebot
services:
  ollama:
    image: ollama/ollama:0.35.0
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
  securebot:
    build: ./app
    environment:
      ISS_SECRET: "${ISS_SECRET:?set ISS_SECRET (from the instructor) in .env}"
      MODEL: "llama3.2:1b"
      GUARDRAIL: "${GUARDRAIL:-off}"
      OLLAMA_URL: "http://ollama:11434"
    ports:
      - "5000:5000"
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama:
