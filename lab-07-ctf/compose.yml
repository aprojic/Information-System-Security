# Lab 07 — target for the CTF part: OWASP Juice Shop.
# Start (in Kali):  docker compose up -d   →  http://localhost:3000
# Stop:             docker compose down
# The blue-team part needs no Docker: make_incident.py in this folder writes your incident.log.
services:
  juiceshop:
    image: bkimminich/juice-shop:v20.2.0
    ports:
      - "3000:3000"
    restart: unless-stopped
